name: Build and Release qpx_widgets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"

      - name: Install Python dependencies
        working-directory: qpx_widgets
        run: |
          python -m pip install --upgrade pip
          pip install build hatch "jupyterlab>=4.4,<5"

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: qpx_widgets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          version = json.loads(Path("package.json").read_text())["version"]
          python_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert version == python_version, (version, python_version)
          assert os.environ["RELEASE_TAG"] == f"v{version}", os.environ["RELEASE_TAG"]
          PY

      - name: Install Node dependencies
        working-directory: qpx_widgets
        run: |
          npm install -g @yarnpkg/cli-dist@4.9.2
          yarn install --immutable

      - name: Build the extension
        working-directory: qpx_widgets
        run: |
          yarn run build:lib
          yarn run build:nbextension
          yarn run build:labextension
          python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qpx_widgets-dist
          path: |
            qpx_widgets/dist/*.whl
            qpx_widgets/dist/*.tar.gz
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            qpx_widgets/dist/*.whl
            qpx_widgets/dist/*.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
